{% extends "base.html" %}
{% block title %}Můj profil &ndash; Kniha jízd{% endblock %}

{% block content %}
<h1 class="text-2xl font-extrabold tracking-tight mb-5">Můj profil</h1>

{% if error %}
<div class="rounded-xl bg-danger/10 text-danger border border-danger/30 px-4 py-3 mb-5 text-sm font-semibold">{{ error }}</div>
{% endif %}

<form method="post" action="/kniha-jizd/account/profile" class="kj-card max-w-lg">
  {{ csrf_field(request) }}
  <label class="kj-label mt-0">Jméno a příjmení</label>
  <input class="kj-input" name="full_name" required value="{{ user.full_name }}">
  <label class="kj-label">Telefon</label>
  <input class="kj-input" name="phone" value="{{ user.phone or '' }}">
  <label class="kj-label">E-mail</label>
  <input class="kj-input bg-surface" value="{{ user.email }}" disabled>
  <p class="text-xs text-muted mt-1">E-mail je přihlašovací jméno – změnu provádí administrátor.</p>
  <button type="submit" class="kj-btn mt-5">Uložit profil</button>
</form>

<a href="/kniha-jizd/account/password" class="inline-block mt-4 text-sm font-bold text-accent hover:underline">Změnit heslo</a>
{% endblock %}
