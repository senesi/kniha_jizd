{% extends "base.html" %}
{% block title %}Změna hesla &ndash; Kniha jízd{% endblock %}

{% block content %}
<h1 class="text-2xl font-extrabold tracking-tight mb-5">Změna hesla</h1>

{% if error %}
<div class="rounded-xl bg-danger/10 text-danger border border-danger/30 px-4 py-3 mb-5 text-sm font-semibold">{{ error }}</div>
{% endif %}

<form method="post" action="/kniha-jizd/account/password" class="kj-card max-w-lg">
  {{ csrf_field(request) }}
  <label class="kj-label mt-0">Současné heslo</label>
  <input class="kj-input" type="password" name="current_password" required autocomplete="current-password">
  <label class="kj-label">Nové heslo</label>
  <input class="kj-input" type="password" name="new_password" required minlength="8" autocomplete="new-password">
  <p class="text-xs text-muted mt-1">Alespoň 8 znaků.</p>
  <label class="kj-label">Nové heslo znovu</label>
  <input class="kj-input" type="password" name="new_password_again" required minlength="8" autocomplete="new-password">
  <button type="submit" class="kj-btn mt-5">Změnit heslo</button>
</form>
{% endblock %}
