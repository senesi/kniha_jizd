[project]
name = "kniha-jizd"
version = "0.1.0"
description = "Kniha jizd / Evidence vozidel - samostatna aplikace SOLAREG platformy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<1.14",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2,<3.0",
    "pillow>=10.4,<11.0",
    "qrcode[pil]>=7.4,<8.0",
    "httpx>=0.27,<0.28",
    "openpyxl>=3.1,<4.0",
    "reportlab>=4.2,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
